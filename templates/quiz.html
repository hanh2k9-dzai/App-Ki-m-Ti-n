<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>🎁 Đố Vui Đổi Quà - Quiz</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background:
                linear-gradient(
                    160deg,
                    #eef6ff,
                    #f8f9fc
                );

            color: #172033;
        }


        .app {
            width: 100%;
            max-width: 560px;
            margin: auto;
            min-height: 100vh;
            padding-bottom: 30px;
        }


        /* =========================
           HEADER
        ========================= */

        .header {

            position: sticky;
            top: 0;

            z-index: 10;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 14px 16px;

            background: rgba(255,255,255,0.96);

            border-bottom:
                1px solid #e6e9ef;

            backdrop-filter: blur(10px);
        }


        .back {

            text-decoration: none;

            color: #2563eb;

            font-size: 15px;

            font-weight: 800;
        }


        .score-box {

            display: flex;

            align-items: center;

            gap: 6px;

            padding: 8px 13px;

            border-radius: 999px;

            background: #eef5ff;

            color: #1757c2;

            font-size: 14px;

            font-weight: 850;
        }


        #score {

            transition:
                transform .2s ease;

        }


        .score-pop {

            transform:
                scale(1.35);

        }


        /* =========================
           MAIN CARD
        ========================= */

        .quiz-card {

            margin: 18px 14px;

            padding: 20px;

            border-radius: 23px;

            background: white;

            box-shadow:
                0 12px 35px
                rgba(30,50,90,0.08);
        }


        /* =========================
           PROGRESS
        ========================= */

        .progress-row {

            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-bottom: 12px;
        }


        .question-number {

            font-size: 14px;

            font-weight: 850;

            color: #667085;
        }


        .points-label {

            font-size: 13px;

            font-weight: 800;

            color: #16a34a;
        }


        .progress {

            width: 100%;

            height: 7px;

            background: #edf0f5;

            border-radius: 20px;

            overflow: hidden;

            margin-bottom: 22px;
        }


        .progress-bar {

            height: 100%;

            width: 0%;

            background:
                linear-gradient(
                    90deg,
                    #2563eb,
                    #60a5fa
                );

            border-radius: 20px;

            transition:
                width .35s ease;
        }


        /* =========================
           QUESTION
        ========================= */

        .question {

            font-size: 23px;

            line-height: 1.4;

            font-weight: 850;

            margin-bottom: 22px;
        }


        /* =========================
           ANSWERS
        ========================= */

        .answers {

            display: grid;

            gap: 12px;
        }


        .answer {

            width: 100%;

            padding: 16px;

            border: 2px solid #e5e8ee;

            border-radius: 17px;

            background: white;

            color: #172033;

            text-align: left;

            font-size: 16px;

            font-weight: 750;

            cursor: pointer;

            transition:
                transform .15s ease,
                border-color .2s ease,
                background .2s ease;
        }


        .answer:active {

            transform:
                scale(.98);
        }


        .answer:hover {

            border-color:
                #93c5fd;
        }


        .answer.correct {

            background:
                #dcfce7;

            border-color:
                #22c55e;

            color:
                #166534;
        }


        .answer.wrong {

            background:
                #fee2e2;

            border-color:
                #ef4444;

            color:
                #991b1b;
        }


        .answer:disabled {

            cursor: default;
        }


        /* =========================
           FEEDBACK
        ========================= */

        .feedback {

            min-height: 30px;

            margin-top: 15px;

            text-align: center;

            font-size: 15px;

            font-weight: 850;
        }


        .feedback.success {

            color: #16a34a;
        }


        .feedback.error {

            color: #dc2626;
        }


        /* =========================
           NEXT BUTTON
        ========================= */

        .next-button {

            width: 100%;

            margin-top: 14px;

            padding: 15px;

            border: none;

            border-radius: 16px;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #1d4ed8
                );

            color: white;

            font-size: 16px;

            font-weight: 850;

            cursor: pointer;

            box-shadow:
                0 8px 20px
                rgba(37,99,235,.2);
        }


        .next-button:active {

            transform:
                scale(.98);
        }


        .hidden {

            display: none !important;
        }


        /* =========================
           LOADING
        ========================= */

        .loading {

            text-align: center;

            padding: 45px 10px;

            color: #667085;

            font-weight: 700;
        }


        .spinner {

            width: 34px;

            height: 34px;

            margin: 0 auto 12px;

            border:
                4px solid #e5e7eb;

            border-top-color:
                #2563eb;

            border-radius: 50%;

            animation:
                spin .7s linear infinite;
        }


        @keyframes spin {

            to {
                transform:
                    rotate(360deg);
            }

        }


        /* =========================
           RESULT
        ========================= */

        .result {

            text-align: center;

            padding: 10px 0;
        }


        .result-icon {

            font-size: 55px;

            margin-bottom: 8px;
        }


        .result-title {

            font-size: 25px;

            font-weight: 900;

            margin-bottom: 5px;
        }


        .result-subtitle {

            color: #667085;

            margin-bottom: 20px;
        }


        .final-score {

            display: inline-block;

            padding: 13px 25px;

            border-radius: 18px;

            background: #eef5ff;

            color: #2563eb;

            font-size: 30px;

            font-weight: 900;

            margin-bottom: 20px;
        }


        .restart-button {

            width: 100%;

            padding: 15px;

            border: none;

            border-radius: 16px;

            background: #111827;

            color: white;

            font-size: 16px;

            font-weight: 850;

            cursor: pointer;
        }


        /* =========================
           AI DEMO
        ========================= */

        .ai-card {

            margin: 14px;

            padding: 17px;

            border-radius: 20px;

            background:
                linear-gradient(
                    135deg,
                    #111827,
                    #1f2937
                );

            color: white;
        }


        .ai-title {

            font-size: 17px;

            font-weight: 900;

            margin-bottom: 5px;
        }


        .ai-description {

            font-size: 13px;

            opacity: .75;

            line-height: 1.5;
        }


        .ai-button {

            width: 100%;

            margin-top: 12px;

            padding: 13px;

            border: none;

            border-radius: 13px;

            background:
                linear-gradient(
                    135deg,
                    #8b5cf6,
                    #7c3aed
                );

            color: white;

            font-weight: 850;

            cursor: pointer;
        }


        .ai-result {

            margin-top: 14px;

            padding: 13px;

            border-radius: 13px;

            background:
                rgba(255,255,255,.08);

            font-size: 14px;

            line-height: 1.6;
        }


    </style>
</head>


<body>


<div class="app">


    <!-- =========================
         HEADER
    ========================== -->

    <header class="header">

        <a
            href="/"
            class="back">

            ← Trang chủ

        </a>


        <div class="score-box">

            ⭐

            <span id="score">
                0
            </span>

            điểm

        </div>

    </header>



    <!-- =========================
         QUIZ
    ========================== -->

    <main>


        <section
            class="quiz-card"
            id="quizCard">


            <!-- LOADING -->

            <div
                id="loading"
                class="loading">

                <div class="spinner"></div>

                Đang tải câu hỏi...

            </div>



            <!-- CONTENT -->

            <div
                id="quizContent"
                class="hidden">


                <div class="progress-row">

                    <div
                        class="question-number"
                        id="questionNumber">

                        Câu 1/10

                    </div>


                    <div
                        class="points-label">

                        +10 điểm

                    </div>

                </div>



                <div class="progress">

                    <div
                        class="progress-bar"
                        id="progressBar">

                    </div>

                </div>



                <div
                    class="question"
                    id="question">

                </div>



                <div
                    class="answers"
                    id="answers">

                </div>



                <div
                    class="feedback"
                    id="feedback">

                </div>



                <button
                    class="next-button hidden"
                    id="nextButton">

                    Câu tiếp theo →

                </button>


            </div>


        </section>



        <!-- =========================
             RESULT
        ========================== -->

        <section
            class="quiz-card hidden"
            id="resultCard">


            <div class="result">


                <div class="result-icon">

                    🏆

                </div>


                <div class="result-title">

                    Hoàn thành!

                </div>


                <div class="result-subtitle">

                    Bạn đã hoàn thành bộ câu hỏi.

                </div>


                <div
                    class="final-score">

                    ⭐

                    <span id="finalScore">

                        0

                    </span>

                    điểm

                </div>


                <button
                    class="restart-button"
                    id="restartButton">

                    🔄 Chơi bộ câu hỏi mới

                </button>


            </div>


        </section>



        <!-- =========================
             AI QUESTION
        ========================== -->

        <section
            class="ai-card">


            <div class="ai-title">

                🤖 Câu hỏi AI ngẫu nhiên

            </div>


            <div class="ai-description">

                Tạo một câu hỏi kiến thức ngẫu nhiên
                bằng hệ thống AI demo.

            </div>


            <button
                class="ai-button"
                id="aiButton">

                ✨ Tạo câu hỏi

            </button>


            <div
                class="ai-result hidden"
                id="aiResult">

            </div>


        </section>


    </main>


</div>



<script>


/* =========================
   BIẾN
========================= */


let questions = [];

let currentQuestion = 0;

let locked = false;



const scoreElement =
    document.getElementById("score");

const questionElement =
    document.getElementById("question");

const answersElement =
    document.getElementById("answers");

const questionNumberElement =
    document.getElementById("questionNumber");

const progressBar =
    document.getElementById("progressBar");

const feedbackElement =
    document.getElementById("feedback");

const nextButton =
    document.getElementById("nextButton");

const loadingElement =
    document.getElementById("loading");

const quizContent =
    document.getElementById("quizContent");

const resultCard =
    document.getElementById("resultCard");

const quizCard =
    document.getElementById("quizCard");



/* =========================
   BẮT ĐẦU QUIZ
========================= */


async function startQuiz() {


    try {


        loadingElement
            .classList
            .remove("hidden");


        quizContent
            .classList
            .add("hidden");


        resultCard
            .classList
            .add("hidden");


        const response =
            await fetch(
                "/api/question"
            );


        /*
         * API /api/question chỉ trả
         * một câu nên ta reset lại
         * phiên bằng cách reload /quiz
         *
         * Vì app.py hiện tại tạo
         * session mới khi vào /quiz.
         */


        if (!response.ok) {

            throw new Error(
                "Không thể tải câu hỏi"
            );

        }


        /*
         * Tạo bộ câu hỏi bằng cách
         * gọi API nhiều lần.
         */

        questions = [];


        for (
            let i = 0;
            i < 10;
            i++
        ) {


            const r =
                await fetch(
                    "/api/question"
                );


            const q =
                await r.json();


            questions.push(q);

        }


        currentQuestion = 0;


        scoreElement.textContent =
            "0";


        loadingElement
            .classList
            .add("hidden");


        quizContent
            .classList
            .remove("hidden");


        showQuestion();


    }


    catch (error) {


        loadingElement.innerHTML = `

            ❌ Không thể tải câu hỏi.

            <br><br>

            Hãy kiểm tra app.py
            và thử tải lại trang.

        `;


        console.error(error);

    }

}



/* =========================
   HIỂN THỊ CÂU HỎI
========================= */


function showQuestion() {


    locked = false;


    const q =
        questions[currentQuestion];


    questionNumberElement.textContent =

        `Câu ${currentQuestion + 1}/${questions.length}`;


    progressBar.style.width =

        `${((currentQuestion + 1) / questions.length) * 100}%`;


    questionElement.textContent =
        q.question;


    answersElement.innerHTML =
        "";


    feedbackElement.textContent =
        "";


    feedbackElement.className =
        "feedback";


    nextButton
        .classList
        .add("hidden");



    q.answers.forEach(
        (answer, index) => {


            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "answer";


            button.textContent =

                `${String.fromCharCode(65 + index)}. ${answer}`;


            button.addEventListener(
                "click",
                () => {

                    checkAnswer(
                        index,
                        button
                    );

                }
            );


            answersElement.appendChild(
                button
            );

        }
    );

}



/* =========================
   KIỂM TRA ĐÁP ÁN
========================= */


async function checkAnswer(
    answerIndex,
    clickedButton
) {


    if (locked) {

        return;

    }


    locked = true;


    const q =
        questions[currentQuestion];


    try {


        const response =
            await fetch(
                "/api/answer",
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body: JSON.stringify({

                        question_id:
                            q.id,

                        answer:
                            answerIndex

                    })

                }
            );


        const data =
            await response.json();


        const allButtons =
            document.querySelectorAll(
                ".answer"
            );


        allButtons.forEach(
            button => {

                button.disabled = true;

            }
        );



        /* ĐÚNG */

        if (data.correct) {


            clickedButton
                .classList
                .add("correct");


            feedbackElement.textContent =

                `🎉 Chính xác! +${data.points} điểm`;


            feedbackElement.className =

                "feedback success";


            updateScore(
                data.score
            );


        }


        /* SAI */

        else {


            clickedButton
                .classList
                .add("wrong");


            allButtons[
                data.correct_answer
            ]
                .classList
                .add("correct");


            feedbackElement.textContent =

                "❌ Chưa đúng! Đáp án đúng đã được đánh dấu.";


            feedbackElement.className =

                "feedback error";


            updateScore(
                data.score
            );

        }


        nextButton
            .classList
            .remove("hidden");


    }


    catch (error) {


        console.error(error);


        feedbackElement.textContent =

            "⚠️ Có lỗi khi kiểm tra đáp án.";


        locked = false;

    }

}



/* =========================
   CẬP NHẬT ĐIỂM
========================= */


function updateScore(
    score
) {


    scoreElement.textContent =
        score;


    scoreElement
        .classList
        .add("score-pop");


    setTimeout(
        () => {

            scoreElement
                .classList
                .remove("score-pop");

        },
        200
    );

}



/* =========================
   CÂU TIẾP THEO
========================= */


nextButton.addEventListener(
    "click",
    () => {


        currentQuestion++;


        if (
            currentQuestion >=
            questions.length
        ) {


            finishQuiz();


            return;

        }


        showQuestion();

    }
);



/* =========================
   HOÀN THÀNH
========================= */


function finishQuiz() {


    quizCard
        .classList
        .add("hidden");


    resultCard
        .classList
        .remove("hidden");


    document.getElementById(
        "finalScore"
    ).textContent =
        scoreElement.textContent;

}



/* =========================
   CHƠI LẠI
========================= */


document
    .getElementById(
        "restartButton"
    )
    .addEventListener(
        "click",
        () => {

            window.location.href =
                "/quiz";

        }
    );



/* =========================
   AI DEMO
========================= */


document
    .getElementById(
        "aiButton"
    )
    .addEventListener(
        "click",
        async () => {


            const button =
                document.getElementById(
                    "aiButton"
                );


            const result =
                document.getElementById(
                    "aiResult"
                );


            button.disabled = true;

            button.textContent =
                "⏳ Đang tạo câu hỏi...";


            result
                .classList
                .remove("hidden");


            result.textContent =
                "Đang tạo...";


            try {


                const response =
                    await fetch(
                        "/api/ai-question"
                    );


                const data =
                    await response.json();


                result.innerHTML = `

                    <strong>
                        ${data.question}
                    </strong>

                    <br><br>

                    ${data.answers
                        .map(
                            (answer, index) =>
                            `${String.fromCharCode(65 + index)}. ${answer}`
                        )
                        .join("<br>")}

                `;


            }


            catch (error) {


                result.textContent =
                    "⚠️ Không tạo được câu hỏi.";

            }


            button.disabled = false;

            button.textContent =
                "✨ Tạo câu hỏi";

        }
    );



/* =========================
   CHẠY
========================= */


startQuiz();


</script>


</body>
</html>
