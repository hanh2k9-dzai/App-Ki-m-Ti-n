<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Thẻ xác minh Monetag -->
    <meta name="monetag" content="a47fe899c3c3e444d241ac74f8441b0d">

    <title>SMART REWARD</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- File CSS Riêng Bằng Flask url_for (Kèm Version Để Tránh Dính Cache) -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=1.1">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="user-info">
                <div class="avatar">S</div>
                <div class="user-text">
                    <span class="name">SMART</span>
                    <span class="badge">REWARD</span>
                </div>
            </div>
            <div class="header-icons">
                <i class="fa-regular fa-bell"></i>
                <i class="fa-regular fa-user"></i>
            </div>
        </header>

        <!-- Main Content -->
        <main class="content">
            {% block content %}{% endblock %}
        </main>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <a href="/" class="nav-item {% if request.path == '/' %}active{% endif %}">
                <i class="fa-solid fa-house"></i>
                <span>Trang chủ</span>
            </a>
            <a href="/tasks" class="nav-item {% if request.path == '/tasks' %}active{% endif %}">
                <i class="fa-solid fa-bullseye"></i>
                <span>Nhiệm vụ</span>
            </a>
            <a href="/wallet" class="nav-item {% if request.path == '/wallet' %}active{% endif %}">
                <i class="fa-solid fa-sack-dollar"></i>
                <span>Ví</span>
            </a>
            <a href="/quiz" class="nav-item {% if request.path == '/quiz' %}active{% endif %}">
                <i class="fa-solid fa-circle-question"></i>
                <span>Câu hỏi</span>
            </a>
        </nav>
    </div>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
